<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    footer {
      background: linear-gradient(to right, #ffffff, #f5f5f5);
      text-align: center;
      padding: 20px;
      margin-top: 50px;
      border-top: 2px solid #ff6600;
      color: #555;
      font-family: 'Cairo', sans-serif;
    }
    footer p {
      margin: 5px 0;
    }
    footer a {
      text-decoration: none;
      color: #ff6600;
      margin: 0 8px;
      transition: color 0.3s ease;
    }
    footer a:hover {
      color: #333;
    }
  </style>
</head>
<body>
  <footer>
    <p>© 2025 Fatom Fashion - جميع الحقوق محفوظة</p>
    <p>
      <a href="#">انستغرام</a> |

      <a href="#">فيسبوك</a>
    </p>
  </footer>
</body>
</html>
